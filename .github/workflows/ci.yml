name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: lint • typecheck • test • build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  gitleaks:
    name: secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-deploy:
    name: trigger deploy in authprint-cloud
    needs: [ci, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'alejofernandez/authprint'
    runs-on: ubuntu-latest
    steps:
      # Uses secrets.CLOUD_DISPATCH_TOKEN (fine-grained PAT configured per infra/PROVISIONING.md §12) to dispatch deployment to alejofernandez/authprint-cloud.
      - name: Dispatch deploy event to authprint-cloud
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
        run: |
          gh api repos/alejofernandez/authprint-cloud/dispatches \
            -f event_type='deploy-editor' \
            -f client_payload[sha]='${{ github.sha }}' \
            -f client_payload[ref]='main'

